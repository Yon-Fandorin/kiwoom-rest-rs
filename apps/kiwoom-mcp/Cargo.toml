[package]
name = "kiwoom-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kiwoom-client = { path = "../../crates/kiwoom-client" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
thiserror.workspace = true
clap = { version = "4.6", features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client"] }
reqwest.workspace = true

[lints]
workspace = true
